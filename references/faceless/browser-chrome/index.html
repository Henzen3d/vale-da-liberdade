<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>browser chrome</title>
  <style>
    html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
    .win {
      position: absolute;
      left: var(--x); top: var(--y);
      width: var(--w); height: var(--h);
      border-radius: 14px;
      box-shadow: 0 28px 80px rgba(0,0,0,.45);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .bar {
      height: 44px;
      background: #1c1f26;
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px;
      flex: none;
    }
    .dots { display: flex; gap: 7px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
    .omni {
      flex: 1;
      height: 26px;
      border-radius: 13px;
      background: #0f1217;
      color: #c8cdd6;
      font: 600 13px/26px "Geist", "Inter", "Segoe UI", sans-serif;
      padding: 0 12px;
      white-space: nowrap;
      overflow: hidden;
    }
    .lock { color: #7d8694; margin-right: 6px; }
    .pane { flex: 1; background: transparent; }
  </style>
</head>
<body>
  <div class="win" id="win">
    <div class="bar">
      <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
      <div class="omni"><span class="lock">🔒</span><span id="addr"></span></div>
    </div>
    <div class="pane"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("addr").textContent = q.get("url") || "";
    const s = document.getElementById("win").style;
    s.setProperty("--x", (q.get("x") || 180) + "px");
    s.setProperty("--y", (q.get("y") || 56) + "px");
    s.setProperty("--w", (q.get("w") || 1560) + "px");
    s.setProperty("--h", (q.get("h") || 920) + "px");
  </script>
</body>
</html>
