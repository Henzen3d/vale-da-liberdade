<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Vale — lower third</title>
  <style>
    /* Motor CSS: edite aqui. Fundo #00ff00 some no ffmpeg (chromakey). */
    :root {
      --cream: #f4efe4;
      --coral: #c24b3f;
      --navy: #141820;
      --ink: #f4efe4;
      --amber: #e8a23d;
      --green: #00ff00;
    }
    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      background: var(--green);
      overflow: hidden;
      font-family: "Geist", "Inter", "Segoe UI", sans-serif;
    }
    .stage { position: relative; width: 1920px; height: 1080px; }

    .l3 {
      position: absolute;
      left: 56px;
      right: 56px;
      bottom: 56px;
      display: flex;
      align-items: stretch;
      gap: 0;
      transform: translateY(28px);
      opacity: 0;
      animation: l3-in 720ms cubic-bezier(.16,1,.3,1) 180ms forwards;
    }
    .rule {
      width: 8px;
      background: var(--coral);
      flex: 0 0 8px;
      transform: scaleY(0);
      transform-origin: bottom;
      animation: rule-in 520ms cubic-bezier(.16,1,.3,1) 180ms forwards;
    }
    .card {
      flex: 1;
      background: #141820;
      color: var(--ink);
      padding: 18px 28px 16px 22px;
      min-height: 112px;
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
    }
    .kicker {
      display: inline-block;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--navy);
      background: var(--amber);
      padding: 3px 10px 2px;
      margin-bottom: 8px;
    }
    .line {
      font-size: 34px;
      line-height: 1.15;
      font-weight: 650;
      max-width: 1480px;
      color: var(--cream);
    }
    .src {
      margin-top: 6px;
      font-size: 16px;
      letter-spacing: .04em;
      color: rgba(244,239,228,.72);
    }
    @keyframes l3-in {
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes rule-in {
      to { transform: scaleY(1); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="l3" id="l3">
      <div class="rule" aria-hidden="true"></div>
      <div class="card">
        <div class="kicker" id="kicker">FONTE</div>
        <div class="line" id="line">Manchete</div>
        <div class="src" id="src">site</div>
      </div>
    </div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const set = (id, key, fallback) => {
      const el = document.getElementById(id);
      if (el) el.textContent = q.get(key) || fallback;
    };
    set("kicker", "kicker", "FONTE");
    set("line", "line", "Manchete");
    set("src", "src", "");
  </script>
</body>
</html>
