<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup X Broadcast • Modelo 1 (Light Studio Editorial)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="gsap.min.js"></script>
<script>window.gsap || document.write('<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"><\/script>')</script>

<style>
  :root {
    --bg-canvas: #f0f4f9;
    --card-white: #ffffff;
    --text-main: #0f1419;
    --text-muted: #536471;
    --twitter-blue: #1d9bf0;
    --heart-pink: #f91880;
    --border-subtle: #eff3f4;
    --border-media: #cfd9de;
    --shadow-card: 0 24px 60px rgba(15, 23, 42, 0.12), 0 8px 24px rgba(15, 23, 42, 0.06);
    --shadow-diagonal: 18px 0 40px rgba(15, 23, 42, 0.09);
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0b0f19;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-sans);
  }

  /* Canvas Fixo 1920x1080 (16:9 Broadcast) com auto-scale */
  .broadcast-stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: 
      radial-gradient(circle at 82% 28%, rgba(219, 234, 254, 0.75) 0%, transparent 55%),
      radial-gradient(circle at 50% 90%, rgba(224, 231, 255, 0.45) 0%, transparent 50%),
      linear-gradient(135deg, #f8fafc 0%, #edf2f7 50%, #e2e8f0 100%);
    overflow: hidden;
    box-shadow: 0 0 100px rgba(0, 0, 0, 0.6);
  }

  /* Malha sutil de fundo de estúdio broadcast */
  .studio-mesh {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(15, 23, 42, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15, 23, 42, 0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* Faixa de onda/iluminação de fundo */
  .studio-glow-sweep {
    position: absolute;
    width: 1200px;
    height: 1200px;
    right: -200px;
    top: -200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    filter: blur(60px);
  }

  /* ----------------------------------------------------
     PAINEL DIAGONAL BRANCO (ESQUERDA)
     ---------------------------------------------------- */
  .diagonal-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 44%;
    height: 100%;
    z-index: 2;
    filter: drop-shadow(var(--shadow-diagonal));
  }

  .diagonal-shape {
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #ffffff 0%, #fcfdfe 100%);
    clip-path: polygon(0 0, 100% 0, 68% 100%, 0 100%);
    position: relative;
  }

  /* Friso sutil na borda diagonal */
  .diagonal-shape::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 100%;
    height: 100%;
    clip-path: polygon(100% 0, 99.4% 0, 67.4% 100%, 68% 100%);
    background: linear-gradient(180deg, rgba(226, 232, 240, 0.8), rgba(203, 213, 225, 0.4));
  }

  /* Conteúdo do Persona / Speaker */
  .speaker-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 36%;
    height: 100%;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-left: 20px;
  }

  .avatar-frame {
    position: relative;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    box-shadow: 
      0 24px 50px rgba(15, 23, 42, 0.16),
      0 4px 12px rgba(15, 23, 42, 0.08);
    background: #ffffff;
    padding: 6px;
    border: 1px solid rgba(226, 232, 240, 0.8);
  }

  .avatar-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    display: block;
    background: #e2e8f0;
  }

  .speaker-info {
    margin-top: 36px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .speaker-name-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .speaker-name {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: -1.2px;
    color: #000000;
    line-height: 1.1;
  }

  .verified-badge {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .speaker-handle {
    margin-top: 6px;
    font-size: 36px;
    font-weight: 700;
    color: #1a73e8;
    letter-spacing: -0.5px;
  }

  /* ----------------------------------------------------
     CARD DO POST DO X (DIREITA)
     ---------------------------------------------------- */
  .tweet-stage {
    position: absolute;
    top: 0;
    right: 0;
    width: 64%;
    height: 100%;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 90px 40px 40px;
  }

  .tweet-card {
    width: 100%;
    max-width: 1120px;
    background: var(--card-white);
    border-radius: 28px;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(0, 0, 0, 0.08);
    padding: 36px 44px 32px 44px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: relative;
    transition: transform 0.3s ease;
  }

  /* Topo do Tweet: Avatar, Nome, Handle, Logo X */
  .tweet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .author-left {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .author-avatar {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    object-fit: cover;
    background: #cbd5e1;
    border: 1px solid rgba(0, 0, 0, 0.08);
  }

  .author-meta {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .author-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .author-name {
    font-size: 26px;
    font-weight: 800;
    color: var(--text-main);
    letter-spacing: -0.5px;
  }

  .badge-small {
    width: 22px;
    height: 22px;
  }

  .author-handle {
    font-size: 20px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .x-logo {
    width: 32px;
    height: 32px;
    color: #000000;
    opacity: 0.95;
  }

  /* Texto Principal do Post (FONTE AMPLIADA PARA BROADCAST) */
  .tweet-body {
    font-size: 32px;
    line-height: 1.45;
    font-weight: 600;
    color: #0f1419;
    letter-spacing: -0.4px;
    word-break: break-word;
  }

  .tweet-hashtag {
    color: var(--twitter-blue);
    font-weight: 700;
    display: inline-block;
    margin-top: 6px;
  }

  /* Mídia Anexa (Imagem da Matéria / Tribunal) */
  .tweet-media-box {
    width: 100%;
    height: 430px;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border-media);
    background: #0f172a;
    position: relative;
  }

  .tweet-media-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 32%;
    display: block;
  }

  /* Timestamp & Visualizações */
  .tweet-timestamp-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 19px;
    color: var(--text-muted);
    font-weight: 500;
    padding-top: 4px;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 16px;
  }

  .tweet-timestamp-row b {
    color: var(--text-main);
    font-weight: 700;
  }

  /* Rodapé de Engajamento (Ações) */
  .tweet-actions-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
  }

  .action-item {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-muted);
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-item.like {
    color: var(--heart-pink);
  }

  .action-item.like svg path {
    fill: var(--heart-pink);
  }

  /* Botão de Replay Flutuante (Discreto para Apresentação) */
  .replay-btn {
    position: absolute;
    bottom: 24px;
    right: 28px;
    z-index: 50;
    background: rgba(15, 23, 42, 0.85);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 30px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .replay-btn:hover {
    background: rgba(15, 23, 42, 1);
    transform: scale(1.05);
    border-color: #38bdf8;
  }
</style>
</head>
<body>

<div class="broadcast-stage" id="stage">
  <div class="studio-mesh"></div>
  <div class="studio-glow-sweep"></div>

  <!-- Painel Diagonal Branco (Esquerda) -->

  <!-- Card do Post do X (Direita) -->
  <div class="tweet-stage">
    <div class="tweet-card" id="tweetCard">

        <div class="author-left">

          <div class="author-meta">
            <div class="author-name-row">
              <span class="author-name" id="authorName">Alexandre de Moraes</span>
              <svg class="badge-small" viewBox="0 0 22 22" width="22" height="22">
                <circle cx="11" cy="11" r="9" fill="#ffffff"/>
                <path d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.69.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z" fill="#1D9BF0"/>
              </svg>

        <!-- Logo do X -->
        <svg class="x-logo" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </div>

      <!-- Corpo do Post -->
      <div class="tweet-body" id="tweetBody">
        O Supremo Tribunal Federal reafirma seu compromisso inegociável com a democracia, a soberania nacional e a estrita observância da Constituição.<br>

      <!-- Mídia Anexa -->

        <img class="tweet-media-img" id="mediaImg" src="assets/mockup-x/themis_justice.jpg" alt="Justiça STF">

      <div class="tweet-timestamp-row">

        <!-- Reply -->

            </svg>

        </div>

        <!-- Bookmark -->
        <div class="action-item">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
        </div>

        <!-- Share -->
        <div class="action-item">
          <div class="action-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">

  <!-- Botão para Testar/Replay da Animação -->
  <button class="replay-btn" id="replayBtn" onclick="playEntranceAnimation()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/></svg>
    Animar Novamente
  </button>
</div>

<script>
  // Auto-ajuste de escala para caber na janela do navegador mantendo 1920x1080
  function fitStageToWindow() {
    const stage = document.getElementById('stage');
    const scaleX = window.innerWidth / 1920;
    const scaleY = window.innerHeight / 1080;
    const scale = Math.min(scaleX, scaleY, 1);
    stage.style.transform = `scale(${scale})`;
    stage.style.transformOrigin = 'center center';
  }

  window.addEventListener('resize', fitStageToWindow);
  window.addEventListener('DOMContentLoaded', () => {
    fitStageToWindow();
    playEntranceAnimation();
  });

  // Animação de Entrada Sequencial Broadcast com GSAP
  let currentTl = null;
  function playEntranceAnimation() {
    if (!window.gsap) return;
    if (currentTl) currentTl.kill();

    const diagonal = document.getElementById('diagonalBg');
    const avatar = document.getElementById('avatarFrame');
    const speakerInfo = document.getElementById('speakerInfo');
    const tweetCard = document.getElementById('tweetCard');
    const heart = document.getElementById('heartIcon');

    const tl = gsap.timeline();
    currentTl = tl;

    // Reset inicial
    gsap.set(diagonal, { x: -600, opacity: 0 });
    gsap.set(avatar, { scale: 0.5, opacity: 0, rotation: -8 });
    gsap.set(speakerInfo, { y: 35, opacity: 0 });
    gsap.set(tweetCard, { x: 120, y: 30, scale: 0.94, opacity: 0 });
    gsap.set(heart, { scale: 1 });

    // 1. Faixa diagonal desliza com força da esquerda
    tl.to(diagonal, {
      x: 0,
      opacity: 1,
      duration: 0.85,
      ease: "power3.out"
    });

    // 2. Avatar circular emerge com pop elástico amortecido
    tl.to(avatar, {
      scale: 1,
      opacity: 1,
      rotation: 0,
      duration: 0.95,
      ease: "elastic.out(1, 0.45)"
    }, "-=0.55");

    // 3. Nome e handle surgem em fade ascendente
    tl.to(speakerInfo, {
      y: 0,
      opacity: 1,
      duration: 0.6,
      ease: "power2.out"
    }, "-=0.6");

    // 4. Card do X entra pela direita com profundidade suave
    tl.to(tweetCard, {
      x: 0,
      y: 0,
      scale: 1,
      opacity: 1,
      duration: 0.9,
      ease: "power3.out"
    }, "-=0.5");

    // 5. Micro-animação de like pulsando
    tl.to(heart, {
      scale: 1.45,
      duration: 0.18,
      ease: "back.out(2)"
    }, "+=0.3");
    tl.to(heart, {
      scale: 1,
      duration: 0.35,
      ease: "elastic.out(1.2, 0.3)"
    });
  }
</script>
</body>
</html>
