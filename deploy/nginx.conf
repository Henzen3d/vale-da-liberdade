server {
    listen 80;
    server_name news.mob.tec.br radio.mob.tec.br localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/ld+json application/xml text/xml application/rss+xml image/svg+xml font/woff2 application/manifest+json;
    gzip_min_length 256;

    # ITEM 6: Brotli — módulo ngx_http_brotli_filter_module ausente na imagem nginx:1.27-alpine.
    # gzip continua ativo; Cloudflare já serve Brotli na borda após primeiro HIT.

    # Security-ish headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── Supabase (Kong) reverse proxy — Google OAuth + REST ──
    # web joins external network supabase_default (docker-compose.yml)
    location /auth/v1/ {
        proxy_pass http://supabase-kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass_request_headers on;
        proxy_buffering off;
        client_max_body_size 10m;
    }

    location /rest/v1/ {
        proxy_pass http://supabase-kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_pass_request_headers on;
        proxy_buffering off;
    }

    location /realtime/v1/ {
        proxy_pass http://supabase-kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location = /feed.xml {
        default_type application/rss+xml;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
    location = /feed.json {
        default_type application/feed+json;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }
    location = /data/episodes.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=120";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Podcast audio — long cache, range requests for seeking
    location /audio/ {
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
        types { audio/mpeg mp3; }
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Service Worker — SEMPRE revalidar (no-cache). sw.js nunca deve ser cacheado
    # por muito tempo; se o Cloudflare/navegador cachear por 1 ano, o bump do cache
    # do PWA (e mudanças de UX) não propaga para quem já instalou o app.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Admin dashboard — SEMPRE revalidar (fase de desenvolvimento).
    # Sem isso o Chrome serve admin_*.js e o shell HTML em cache, ignorando
    # os novos commits. Os scripts também usam ?v=YYYYMMDDHHMM como 2ª camada.
    # (add_header não herda do server quando a location define os seus —
    #  re-declarar os headers de segurança aqui.)
    location /admin/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # PWA shell
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=60";
    }

    location = /ads.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
