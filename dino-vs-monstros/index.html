<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino vs Monstros</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <header class="glass-panel">
            <div class="stats">
                <div class="stat-box meat-box">
                    <span class="icon">🥩</span>
                    <span id="meat-count">50</span>
                </div>
                <div class="stat-box score-box">
                    <span class="icon">⭐</span>
                    <span id="score-count">0</span>
                </div>
                <div class="stat-box wave-box">
                    <span class="icon">🌊</span>
                    <span id="wave-count">Onda 1</span>
                </div>
            </div>
            <h1>Dino vs Monstros</h1>
        </header>

        <div class="main-content">
            <aside class="sidebar glass-panel">
                <h2>Dinossauros</h2>
                <div class="dino-cards">
                    <div class="dino-card selected" data-type="triceratops" data-cost="50">
                        <div class="dino-icon">🦕</div>
                        <div class="dino-info">
                            <h3>Triceratops</h3>
                            <span class="cost">🥩 50</span>
                        </div>
                    </div>
                    
                    <div class="dino-card locked" data-type="velociraptor" data-cost="100" id="card-velociraptor">
                        <div class="lock-overlay" id="lock-velociraptor">🔒 Desbloqueia: 500 ⭐</div>
                        <div class="dino-icon">🦖</div>
                        <div class="dino-info">
                            <h3>Velociraptor</h3>
                            <span class="cost">🥩 100</span>
                        </div>
                    </div>

                    <div class="dino-card locked" data-type="trex" data-cost="250" id="card-trex">
                        <div class="lock-overlay" id="lock-trex">🔒 Desbloqueia: 1500 ⭐</div>
                        <div class="dino-icon">🐉</div>
                        <div class="dino-info">
                            <h3>T-Rex</h3>
                            <span class="cost">🥩 250</span>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="battlefield-container">
                <div id="battlefield">
                    <!-- O grid e as entidades serão renderizados aqui pelo JS -->
                </div>
            </main>
        </div>

        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content glass-panel">
                <h2>Fim de Jogo!</h2>
                <p>Os monstros destruíram sua base.</p>
                <p>Pontuação Final: <span id="final-score">0</span></p>
                <button id="restart-btn">Jogar Novamente</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
